<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Battle Pass مع 2,400 CP">
  <defs>
    <linearGradient id="bavComboBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241607"/>
      <stop offset="0.55" stop-color="#15100A"/>
      <stop offset="1" stop-color="#0E0E11"/>
    </linearGradient>
    <linearGradient id="bavComboCoin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC27A"/>
      <stop offset="1" stop-color="#FF5A1F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="22" fill="url(#bavComboBg)"/>
  <rect x="1" y="1" width="398" height="298" rx="21" fill="none" stroke="#2E2412" stroke-width="2"/>

  <!-- Battle Pass ticket, left -->
  <g transform="translate(60,96)">
    <rect x="-46" y="-46" width="92" height="118" rx="16" fill="#1B140B" stroke="#FF5A1F" stroke-width="2.2"/>
    <circle cx="-46" cy="18" r="7" fill="#15100A"/>
    <circle cx="46" cy="18" r="7" fill="#15100A"/>
    <line x1="-30" y1="18" x2="30" y2="18" stroke="#3A2A14" stroke-width="2" stroke-dasharray="4 5"/>
    <path d="M0 -24l7 14h15l-12 10 5 15-15-9-15 9 5-15-12-10h15z" fill="#FF5A1F"/>
    <rect x="-24" y="34" width="48" height="8" rx="4" fill="#3A2A14"/>
    <rect x="-24" y="48" width="32" height="6" rx="3" fill="#2A1F10"/>
  </g>

  <!-- Plus -->
  <g stroke="#9B7B52" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="150" x2="172" y2="150"/>
    <line x1="161" y1="139" x2="161" y2="161"/>
  </g>

  <!-- CP coin stack, right -->
  <g transform="translate(272,150)">
    <ellipse cx="0" cy="44" rx="72" ry="20" fill="#0E0E11" opacity=".5"/>
    <ellipse cx="0" cy="26" rx="70" ry="22" fill="url(#bavComboCoin)"/>
    <ellipse cx="0" cy="8" rx="70" ry="22" fill="url(#bavComboCoin)"/>
    <ellipse cx="0" cy="-10" rx="70" ry="22" fill="url(#bavComboCoin)"/>
    <ellipse cx="0" cy="-10" rx="70" ry="22" fill="none" stroke="#7A2E00" stroke-width="2" opacity=".5"/>
    <text x="0" y="-2" fill="#5A1E00" font-size="26" font-weight="700" text-anchor="middle" font-family="sans-serif">CP</text>
  </g>

  <text x="200" y="258" fill="#F4F4F2" font-size="23" font-weight="700" text-anchor="middle" font-family="sans-serif">Battle Pass + 2,400 CP</text>
  <text x="200" y="280" fill="#B4915E" font-size="14" text-anchor="middle" font-family="sans-serif">باقة واحدة، توفير حقيقي</text>
</svg>
