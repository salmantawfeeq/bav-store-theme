<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="معرّف المستلم: ادخل على الحساب الشخصي لصديقك، وانسخ الآيدي">
  <defs>
    <linearGradient id="bavRecipientBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1A20"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="20" fill="url(#bavRecipientBg)"/>
  <rect x="1" y="1" width="398" height="298" rx="19" fill="none" stroke="#2A2A31" stroke-width="2"/>

  <!-- Eyebrow: this is about a FRIEND's id, not the customer's own -->
  <text x="200" y="30" fill="#FF8A4A" font-size="13" font-weight="700" text-anchor="middle" font-family="sans-serif">معرّف المستلم (آيدي صديقك)</text>

  <!-- Row 1: profile card icon -->
  <g>
    <circle cx="40" cy="78" r="16" fill="#FF5A1F"/>
    <g stroke="#101014" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="31" y="71" width="18" height="14" rx="2.5"/>
      <circle cx="37" cy="76" r="2.2"/>
      <path d="M34 82c.6-1.6 1.6-2.4 3-2.4s2.4.8 3 2.4"/>
      <path d="M42.5 75h3.5M42.5 79h3.5"/>
    </g>
    <text x="68" y="84" fill="#F4F4F2" font-size="20" font-weight="700" text-anchor="start" font-family="sans-serif">ادخل على الحساب الشخصي لصديقك</text>
  </g>
  <line x1="40" y1="96" x2="40" y2="138" stroke="#3A3A44" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Row 2: copy icon -->
  <g>
    <circle cx="40" cy="156" r="16" fill="#FF5A1F"/>
    <g stroke="#101014" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <rect x="34" y="150" width="10" height="12" rx="2"/>
      <path d="M38 150v-2a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2h-2"/>
    </g>
    <text x="68" y="162" fill="#F4F4F2" font-size="20" font-weight="700" text-anchor="start" font-family="sans-serif">انسخ الآيدي الظاهر في ملفه</text>
  </g>

  <!-- Example ID chip - the real value is noticeably longer than the
       player-ID schematic's short code, so a smaller font/letter-spacing
       than that one is needed to actually fit inside the same chip width
       (the earlier version of this file overflowed for the same reason
       with a shorter number - learn from that, size for the real text). -->
  <rect x="40" y="194" width="320" height="58" rx="14" fill="#17171C" stroke="#FF5A1F" stroke-width="1.8"/>
  <text x="212" y="229" fill="#F4F4F2" font-size="16" font-family="monospace" text-anchor="middle">UID: 7295435626912859009</text>
  <rect x="58" y="210" width="26" height="26" rx="5" fill="#17171C" stroke="#FF5A1F" stroke-width="2"/>
  <rect x="62" y="206" width="26" height="26" rx="5" fill="none" stroke="#FF5A1F" stroke-width="2"/>

  <text x="200" y="276" fill="#9B9BA5" font-size="13" text-anchor="middle" font-family="sans-serif">(رقم توضيحي بس - آيدي صديقك هيكون مختلف)</text>
</svg>
